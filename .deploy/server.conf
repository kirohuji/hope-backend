# 漫语町 iOS Universal Links AASA
location = /.well-known/apple-app-site-association {
   proxy_pass https://127.0.0.1:3605/.well-known/apple-app-site-association;
   proxy_set_header Host $host;
   proxy_set_header X-Real-IP $remote_addr;
   proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
   proxy_set_header X-Forwarded-Proto $scheme;
   proxy_ssl_server_name on;
   proxy_ssl_verify off;
   default_type application/json;
   add_header Cache-Control "public, max-age=3600";
}

location = /apple-app-site-association {
   proxy_pass https://127.0.0.1:3605/.well-known/apple-app-site-association;
   proxy_set_header Host $host;
   proxy_set_header X-Real-IP $remote_addr;
   proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
   proxy_set_header X-Forwarded-Proto $scheme;
   proxy_ssl_server_name on;
   proxy_ssl_verify off;
   default_type application/json;
   add_header Cache-Control "public, max-age=3600";
}

# 漫语町微信 Universal Link 路径
location ^~ /wechat/ {
   proxy_pass https://127.0.0.1:3605/wechat/;
   proxy_set_header Host $host;
   proxy_set_header X-Real-IP $remote_addr;
   proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
   proxy_set_header X-Forwarded-Proto $scheme;
   proxy_ssl_server_name on;
   proxy_ssl_verify off;
}



location ^~ /api/v1/ {
   proxy_pass http://hope.lourd.top;
   proxy_set_header Host  $host;
   proxy_set_header X-Real-IP $remote_addr;
   proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
   client_max_body_size 100m; 
}
location ^~ /storage/ {
   proxy_pass http://hope.lourd.top;
   proxy_set_header Host  $host;
   proxy_set_header X-Real-IP $remote_addr;
   proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
   client_max_body_size 100m; 
}

location /websocket {
   proxy_pass http://hope.lourd.top/websocket;
	proxy_read_timeout 10000s;
	proxy_redirect off; 
	proxy_set_header Host $host;
	proxy_set_header X-Real-IP $remote_addr;
	proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
	proxy_http_version 1.1;
	proxy_set_header Upgrade $http_upgrade;
	proxy_set_header Connection "upgrade";
}

